rules:
  - id: archdrift.typescript.fetch
    languages:
      - typescript
      - javascript

    severity: INFO

    message: "ARCHDRIFT_TARGET=$TARGET"

    metadata:
      archdrift:
        interaction: SERVICE_CALL
        protocol: http

    pattern: fetch($TARGET, ...)


  - id: archdrift.typescript.grpc-client
    languages:
      - typescript
      - javascript

    severity: INFO

    message: "ARCHDRIFT_TARGET=$TARGET"

    metadata:
      archdrift:
        interaction: SERVICE_CALL
        protocol: grpc

    patterns:
      - pattern: |
          new $CLIENT($TARGET, ...)

      - metavariable-regex:
          metavariable: $CLIENT
          regex: '^[A-Za-z_$][A-Za-z0-9_$]*ServiceClient$'