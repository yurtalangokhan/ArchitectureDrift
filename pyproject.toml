[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "multi-evidence-conformance"
version = "0.1.0"
description = "Multi-Evidence Architecture Conformance research framework"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.8,<3.0",
    "networkx>=3.3,<4.0",
    "PyYAML>=6.0,<7.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.10,<2.0",
]


[project.scripts]
archdrift = "archdrift.cli:main"


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


[tool.mypy]
python_version = "3.11"
strict = true
packages = ["archdrift"]
