[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "multi-evidence-conformance"
version = "0.1.0"
description = "Research prototype for multi-evidence software architecture conformance analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "Gokhan Yurtalan" }
]

dependencies = [
    "pydantic>=2.13.5,<3.0",
    "PyYAML>=6.0,<7.0",
    "networkx>=3.6.1,<4.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.18,<3.0",
    "types-PyYAML>=6.0",
    "types-networkx>=3.6.1",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]


[tool.coverage.run]
branch = true
source = ["archdrift"]


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]


[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = false