services:

  astronomy-db:
    deploy:
      resources:
        limits:
          memory: 256M

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  email:
    healthcheck:
      test:
        - CMD
        - ruby
        - -e
        - require 'socket'; TCPSocket.new('localhost', 6060).close
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 30

  otel-collector:
    command:
      - --config=/etc/otelcol-config.yml
      - --config=/etc/otelcol-config-extras.yml
      - --config=/etc/archdrift-capture.yml
      - --feature-gates=service.profilesSupport

    volumes:
      - type: bind
        source: ${ARCHDRIFT_COLLECTOR_CONFIG}
        target: /etc/archdrift-capture.yml
        read_only: true

      - type: bind
        source: ${ARCHDRIFT_CAPTURE_DIR}
        target: /var/lib/archdrift

  ad:
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'echo > /dev/tcp/localhost/${AD_PORT}'
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 30

  payment:
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - >-
          const net=require('net');const c=new net.Socket();
          c.setTimeout(2000);
          c.connect(50051,'127.0.0.1',()=>{c.destroy();process.exit(0)});
          c.on('error',()=>process.exit(1));
          c.on('timeout',()=>process.exit(1))
      start_period: 180s
      interval: 5s
      timeout: 5s
      retries: 30